services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: layoutcraft-web
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - NODE_ENV=production
